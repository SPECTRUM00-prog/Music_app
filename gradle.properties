# Project-wide Gradle settings.

# Aumentamos la memoria máxima de Gradle a 3 GB (3072m) acorde a tus 16 GB de RAM
org.gradle.jvmargs=-Xmx3072m -XX:+UseG1GC -Dfile.encoding=UTF-8

# Limita los hilos para que tu CPU i5 de bajo consumo no se sature al 100%
org.gradle.workers.max=4

# Activa la compilación en paralelo (estaba comentada con un #)
org.gradle.parallel=true

# Guarda en caché tareas ya compiladas para que las siguientes veces tarde mucho menos
org.gradle.caching=true

# Monitorea los cambios en los archivos en segundo plano
org.gradle.vfs.watch=true

# Mantiene el caché de configuración que ya tenías activado
org.gradle.configuration-cache=true

# Kotlin code style
kotlin.code.style=official